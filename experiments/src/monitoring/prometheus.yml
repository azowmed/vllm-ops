# Prometheus scrape config for the benchmark stack.
# Scrapes vLLM and dcgm-exporter over loopback every 5 s.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]

  - job_name: dcgm
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:9400"]
