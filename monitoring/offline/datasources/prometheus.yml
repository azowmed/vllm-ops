apiVersion: 1

# Offline-only datasource: reaches Prometheus by its compose SERVICE NAME over the
# bridge network. The live stack (grafana/provisioning/datasources/prometheus.yml)
# uses 127.0.0.1:9090 because there everything shares the host network namespace.
# The uid MUST stay "prometheus" so the committed dashboard binds to it.
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: false
